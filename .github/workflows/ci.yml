name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p tsconfig.json
      - name: Pruebas
        run: npx jest --runInBand
      - name: Compilación (el mismo comando que Railway)
        run: npm run build
